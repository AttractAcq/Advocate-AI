name: sovereign-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test Core and the synthetic lab
        run: |
          uv sync --locked --extra phase3
          make fixtures
          make check
          make recovery-rehearsal
          make lab-smoke
      - name: Build Console
        working-directory: apps/console/web
        run: |
          npm ci --ignore-scripts
          npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Python lock and scan advisories
        run: |
          uv lock --check
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.lock
          git diff --exit-code -- requirements.lock
          uvx --from pip-audit==2.10.1 pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
          uv export --locked --extra phase3 --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/phase3-requirements.lock"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/phase3-requirements.lock" --require-hashes --disable-pip --progress-spinner off
      - name: Scan Console dependency lock
        working-directory: apps/console/web
        run: npm audit --audit-level=high
