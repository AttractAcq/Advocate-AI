name: sovereign-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test Core and the synthetic lab
        run: |
          uv sync --locked --extra phase3
          make fixtures
          make check
          make recovery-rehearsal
          make lab-smoke
      - name: Build Console
        working-directory: apps/console/web
        run: |
          npm ci --ignore-scripts
          npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Python lock and scan advisories
        run: |
          uv lock --check
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.lock
          git diff --exit-code -- requirements.lock
          uvx --from pip-audit==2.10.1 pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
          uv export --locked --extra phase3 --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/phase3-requirements.lock"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/phase3-requirements.lock" --require-hashes --disable-pip --progress-spinner off
      - name: Scan Console dependency lock
        working-directory: apps/console/web
        run: npm audit --audit-level=high

  container-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Resolve digest-pinned synthetic Keycloak image
        id: image
        run: |
          echo "ref=$(jq -r '.name + "@" + .digest' infrastructure/lab/container-image.json)" >> "$GITHUB_OUTPUT"
      - name: Scan lab image packages for high and critical advisories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: keycloak-trivy.json
          exit-code: '0'
          cache: 'false'
      - name: Check report and summarize findings
        run: |
          jq -e '.SchemaVersion and .ArtifactName' keycloak-trivy.json >/dev/null
          echo "Keycloak lab image: ${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "High/critical findings: $(jq '[.Results[]?.Vulnerabilities[]?] | length' keycloak-trivy.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Findings require triage before a target release; this job does not approve the image." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain scanner report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keycloak-lab-trivy
          path: keycloak-trivy.json
          retention-days: 30
