name: sovereign-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-containers:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Core and Console images
        run: |
          docker build -f infrastructure/containers/Core.Dockerfile -t sovereign-core:synthetic .
          docker build -f infrastructure/containers/Console.Dockerfile -t sovereign-console:synthetic .
      - name: Exercise isolated synthetic stack
        run: bash infrastructure/containers/smoke.sh
      - name: Exercise Core against networkless pgvector socket
        run: |
          set -euo pipefail
          image="docker.io/pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd"
          docker pull "$image"
          python3 -m scripts.phase3_pgvector_core_socket \
            --pgvector-image "$image" --core-image sovereign-core:synthetic
      - name: Exercise Core against pinned Trixie pgvector candidate
        run: |
          set -euo pipefail
          image="docker.io/pgvector/pgvector@sha256:494f5c1091d49ad96d6070f07ce3c08d92912d6edce1e1595028eb6bbd1db71d"
          docker pull "$image"
          python3 -m scripts.phase3_pgvector_core_socket \
            --pgvector-image "$image" --core-image sovereign-core:synthetic
      - name: Build and exercise Alpine Knowledge candidate
        run: |
          set -euo pipefail
          docker build -f infrastructure/containers/Knowledge.Dockerfile \
            -t sovereign-knowledge:synthetic .
          python3 -m scripts.phase3_pgvector_core_socket \
            --pgvector-image sovereign-knowledge:synthetic \
            --core-image sovereign-core:synthetic
      - name: Build and exercise separate Fleet images
        run: |
          docker build -f infrastructure/containers/FleetApi.Dockerfile -t sovereign-fleet-api:synthetic .
          docker build -f infrastructure/containers/FleetPortal.Dockerfile -t sovereign-fleet-portal:synthetic .
          bash infrastructure/containers/fleet-smoke.sh
      - name: Scan built Core image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sovereign-core:synthetic
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          format: json
          output: core-trivy.json
          exit-code: '0'
          cache: 'false'
      - name: Scan built Console image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sovereign-console:synthetic
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          format: json
          output: console-trivy.json
          exit-code: '0'
          cache: 'false'
      - name: Scan built Fleet API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sovereign-fleet-api:synthetic
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          format: json
          output: fleet-api-trivy.json
          exit-code: '0'
          cache: 'false'
      - name: Scan built Fleet portal image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sovereign-fleet-portal:synthetic
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL,UNKNOWN
          format: json
          output: fleet-portal-trivy.json
          exit-code: '0'
          cache: 'false'
      - name: Summarize built image findings
        run: |
          jq -e '.SchemaVersion and .ArtifactName' core-trivy.json console-trivy.json fleet-api-trivy.json fleet-portal-trivy.json >/dev/null
          echo "Core high/critical/unknown: $(jq '[.Results[]?.Vulnerabilities[]?] | length' core-trivy.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Console high/critical/unknown: $(jq '[.Results[]?.Vulnerabilities[]?] | length' console-trivy.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet API high/critical/unknown: $(jq '[.Results[]?.Vulnerabilities[]?] | length' fleet-api-trivy.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet portal high/critical/unknown: $(jq '[.Results[]?.Vulnerabilities[]?] | length' fleet-portal-trivy.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "This is triage evidence, not release approval." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain built image scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-product-image-trivy
          path: |
            core-trivy.json
            console-trivy.json
            fleet-api-trivy.json
            fleet-portal-trivy.json
          retention-days: 30

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test Core and the synthetic lab
        run: |
          uv sync --locked --extra phase3
          make fixtures
          make check
          make recovery-rehearsal
          make lab-smoke
      - name: Build Console
        working-directory: apps/console/web
        run: |
          npm ci --ignore-scripts
          npm run test
          npm run build
      - name: Build Fleet portal
        working-directory: apps/fleet/web
        run: |
          npm ci --ignore-scripts
          npm run test
          npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Python lock and scan advisories
        run: |
          uv lock --check
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.lock
          git diff --exit-code -- requirements.lock
          uvx --from pip-audit==2.10.1 pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
          uv export --locked --extra phase3 --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/phase3-requirements.lock"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/phase3-requirements.lock" --require-hashes --disable-pip --progress-spinner off
      - name: Scan Console dependency lock
        working-directory: apps/console/web
        run: npm audit --audit-level=high
      - name: Scan Fleet portal dependency lock
        working-directory: apps/fleet/web
        run: npm audit --audit-level=high

  container-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Resolve digest-pinned synthetic Keycloak image
        id: image
        run: |
          echo "ref=$(jq -r '.name + "@" + .digest' infrastructure/lab/container-image.json)" >> "$GITHUB_OUTPUT"
      - name: Scan lab image packages for high and critical advisories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          version: v0.76.2
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: keycloak-trivy.json
          exit-code: '0'
          cache: 'false'
      - name: Check report and summarize findings
        run: |
          jq -e '.SchemaVersion and .ArtifactName' keycloak-trivy.json >/dev/null
          echo "Keycloak lab image: ${{ steps.image.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "High/critical findings: $(jq '[.Results[]?.Vulnerabilities[]?] | length' keycloak-trivy.json)" >> "$GITHUB_STEP_SUMMARY"
          echo "Findings require triage before a target release; this job does not approve the image." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain scanner report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keycloak-lab-trivy
          path: keycloak-trivy.json
          retention-days: 30

  fleet-keycloak-interoperability:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - name: Build Fleet and pull pinned synthetic Keycloak
        run: |
          set -euo pipefail
          uv sync --locked
          docker build -f infrastructure/containers/FleetApi.Dockerfile -t sovereign-fleet-api:synthetic .
          docker build -f infrastructure/containers/FleetPortal.Dockerfile -t sovereign-fleet-portal:synthetic .
          docker pull "$(jq -r '.name + "@" + .digest' infrastructure/lab/container-image.json)"
      - name: Exercise Keycloak PKCE and Fleet role mapping
        run: .venv/bin/python -m scripts.phase8_fleet_keycloak_rehearsal
      - name: Rehearse encrypted Keycloak clean recovery
        run: .venv/bin/python -m scripts.phase8_fleet_keycloak_rehearsal --recovery

  fleet-browser-https-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build synthetic portal
        run: |
          uv sync --locked
          cd apps/fleet/web
          npm ci --ignore-scripts
          npm run build
      - name: Exercise browser PKCE callback and sign-out over HTTPS
        run: |
          set -euo pipefail
          driver="$(command -v chromedriver || find /usr/local/share /opt -name chromedriver -type f -print -quit)"
          test -n "$driver"
          echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
          .venv/bin/python -m scripts.phase8_fleet_browser_rehearsal

  fleet-keycloak-browser-integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - name: Build Fleet and pull pinned synthetic Keycloak
        run: |
          set -euo pipefail
          uv sync --locked
          docker build -f infrastructure/containers/FleetApi.Dockerfile -t sovereign-fleet-api:synthetic .
          docker build -f infrastructure/containers/FleetPortal.Dockerfile -t sovereign-fleet-portal:synthetic .
          docker pull "$(jq -r '.name + "@" + .digest' infrastructure/lab/container-image.json)"
      - name: Exercise Chrome with Keycloak and the Fleet API
        run: |
          set -euo pipefail
          driver="$(command -v chromedriver || find /usr/local/share /opt -name chromedriver -type f -print -quit)"
          test -n "$driver"
          .venv/bin/python -m scripts.phase8_fleet_keycloak_rehearsal --browser --chromedriver "$driver"
      - name: Require and exercise Fleet OTP in Chrome
        run: |
          set -euo pipefail
          driver="$(command -v chromedriver || find /usr/local/share /opt -name chromedriver -type f -print -quit)"
          test -n "$driver"
          .venv/bin/python -m scripts.phase8_fleet_keycloak_rehearsal --browser --mfa --chromedriver "$driver"

  upstream-release-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - name: Prepare approved upstream tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream/crane" "$RUNNER_TEMP/upstream/syft" "$RUNNER_TEMP/upstream/trivy" "$RUNNER_TEMP/upstream/docker-config"
          curl -fsSL --retry 3 https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/upstream/crane.tar.gz"
          curl -fsSL --retry 3 https://github.com/anchore/syft/releases/download/v1.57.1/syft_1.57.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/upstream/syft.tar.gz"
          curl -fsSL --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/upstream/trivy.tar.gz"
          curl -fsSL --retry 3 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 -o "$RUNNER_TEMP/upstream/restic.bz2"
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $RUNNER_TEMP/upstream/crane.tar.gz" | sha256sum --check
          echo "bf52519eb57f675d47c07d43213cb6dff6449f3d6d1147ff6701ed91f44eef0c  $RUNNER_TEMP/upstream/syft.tar.gz" | sha256sum --check
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/upstream/trivy.tar.gz" | sha256sum --check
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  $RUNNER_TEMP/upstream/restic.bz2" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/upstream/crane.tar.gz" -C "$RUNNER_TEMP/upstream/crane" crane
          tar -xzf "$RUNNER_TEMP/upstream/syft.tar.gz" -C "$RUNNER_TEMP/upstream/syft" syft
          tar -xzf "$RUNNER_TEMP/upstream/trivy.tar.gz" -C "$RUNNER_TEMP/upstream/trivy" trivy
          bzip2 -d "$RUNNER_TEMP/upstream/restic.bz2"
          chmod +x "$RUNNER_TEMP/upstream/restic"
          DOCKER_CONFIG="$RUNNER_TEMP/upstream/docker-config" "$RUNNER_TEMP/upstream/trivy/trivy" image --download-db-only --cache-dir "$RUNNER_TEMP/upstream/trivy-cache" --quiet
      - name: Rehearse offline image identity, scan and signed evidence
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase5_upstream_rehearsal \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache"
      - name: Build actual synthetic product images and bind release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 fixtures/generate.py
          docker build -f infrastructure/containers/Core.Dockerfile -t sovereign-core:synthetic .
          docker build -f infrastructure/containers/Console.Dockerfile -t sovereign-console:synthetic .
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase5_product_image_rehearsal \
            --output "$RUNNER_TEMP/product-image-evidence" \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache" \
            --restic "$RUNNER_TEMP/upstream/restic" \
            --restic-sha256 "$(sha256sum "$RUNNER_TEMP/upstream/restic" | cut -d' ' -f1)"
      - name: Retain product image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-product-image-release-evidence
          path: ${{ runner.temp }}/product-image-evidence
          retention-days: 30
      - name: Qualify pinned pgvector Knowledge image archive
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd"
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase5_pgvector_image_intake \
            --image "$image" --output "$RUNNER_TEMP/knowledge-image-evidence" \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache"
      - name: Retain Knowledge image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-knowledge-image-release-evidence
          path: ${{ runner.temp }}/knowledge-image-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Compare updated pgvector Trixie image intake
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/pgvector/pgvector@sha256:494f5c1091d49ad96d6070f07ce3c08d92912d6edce1e1595028eb6bbd1db71d"
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase5_pgvector_image_intake \
            --image "$image" --output "$RUNNER_TEMP/knowledge-trixie-evidence" \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache"
      - name: Retain Trixie Knowledge comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-knowledge-trixie-comparison
          path: ${{ runner.temp }}/knowledge-trixie-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Build and qualify Alpine Knowledge image candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build -f infrastructure/containers/Knowledge.Dockerfile \
            -t sovereign-knowledge:synthetic .
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase5_alpine_knowledge_image \
            --output "$RUNNER_TEMP/alpine-knowledge-evidence" \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache"
      - name: Retain Alpine Knowledge image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-alpine-knowledge-image-evidence
          path: ${{ runner.temp }}/alpine-knowledge-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Sign and verify exact three-image vessel bundle
        shell: bash
        run: |
          set -euo pipefail
          docker build -f infrastructure/containers/Core.Dockerfile \
            --build-arg SOVEREIGN_SYNTHETIC_RELEASE=second \
            -t sovereign-core:synthetic-v2 .
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase5_three_image_release \
            --output "$RUNNER_TEMP/three-image-release-evidence" \
            --update-core-image sovereign-core:synthetic-v2 \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache" \
            --restic "$RUNNER_TEMP/upstream/restic" \
            --restic-sha256 "$(sha256sum "$RUNNER_TEMP/upstream/restic" | cut -d' ' -f1)"
      - name: Retain three-image bundle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-three-image-bundle-evidence
          path: ${{ runner.temp }}/three-image-release-evidence
          if-no-files-found: ignore
          retention-days: 30
      - name: Bind actual Fleet image archives to release evidence
        shell: bash
        run: |
          set -euo pipefail
          docker build -f infrastructure/containers/FleetApi.Dockerfile -t sovereign-fleet-api:synthetic .
          docker build -f infrastructure/containers/FleetPortal.Dockerfile -t sovereign-fleet-portal:synthetic .
          crane="$RUNNER_TEMP/upstream/crane/crane"
          syft="$RUNNER_TEMP/upstream/syft/syft"
          trivy="$RUNNER_TEMP/upstream/trivy/trivy"
          .venv/bin/python -m scripts.phase8_fleet_release_rehearsal \
            --output "$RUNNER_TEMP/fleet-image-evidence" \
            --crane "$crane" --crane-sha256 "$(sha256sum "$crane" | cut -d' ' -f1)" \
            --syft "$syft" --syft-sha256 "$(sha256sum "$syft" | cut -d' ' -f1)" \
            --trivy "$trivy" --trivy-sha256 "$(sha256sum "$trivy" | cut -d' ' -f1)" \
            --trivy-cache "$RUNNER_TEMP/upstream/trivy-cache"
      - name: Retain Fleet image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-fleet-image-release-evidence
          path: ${{ runner.temp }}/fleet-image-evidence
          retention-days: 30

  restic-recovery-rehearsal:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - name: Verify and install pinned restic
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 -o "$RUNNER_TEMP/restic.bz2"
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  $RUNNER_TEMP/restic.bz2" | sha256sum --check
          bzip2 -d "$RUNNER_TEMP/restic.bz2"
          chmod +x "$RUNNER_TEMP/restic"
      - name: Rehearse encrypted repository and clean restore
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          SOVEREIGN_TEST_RESTIC="$RUNNER_TEMP/restic" .venv/bin/python -m unittest tests.test_restic_repository -v
      - name: Validate synthetic backup service and timer syntax
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m infrastructure.deploy.backup_service \
            --service-output "$RUNNER_TEMP/sovereign-backup.service" \
            --timer-output "$RUNNER_TEMP/sovereign-backup.timer" \
            --spec /srv/sovereign/spec.json --repository /srv/sovereign/repository \
            --password-source /etc/sovereign/backup-password \
            --restic "$RUNNER_TEMP/restic" \
            --restic-sha256 "$(sha256sum "$RUNNER_TEMP/restic" | cut -d' ' -f1)" \
            --python /usr/bin/python3 --workdir /opt/sovereign \
            --staging /srv/sovereign/staging --hour-utc 2 --max-age-hours 24
          systemd-analyze verify "$RUNNER_TEMP/sovereign-backup.service" \
            "$RUNNER_TEMP/sovereign-backup.timer"
      - name: Validate synthetic Fleet service unit syntax
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m infrastructure.deploy.fleet_boot_service \
            --output "$RUNNER_TEMP/sovereign-fleet-recover.service" \
            --root /var/lib/sovereign-fleet \
            --trusted-key /etc/sovereign/fleet-trusted.pem \
            --crane /opt/sovereign/bin/crane \
            --python /usr/bin/python3 \
            --workdir /opt/sovereign/app
          .venv/bin/python -m infrastructure.deploy.fleet_backup_service render \
            --service-output "$RUNNER_TEMP/sovereign-fleet-backup.service" \
            --timer-output "$RUNNER_TEMP/sovereign-fleet-backup.timer" \
            --db /var/lib/sovereign-fleet/state/fleet.db \
            --directory /var/lib/sovereign-fleet-backups \
            --key /etc/sovereign/fleet-backup.key \
            --python /usr/bin/python3 \
            --workdir /opt/sovereign/app --hour-utc 3 \
            --max-age-hours 26 --max-archives 30
          systemd-analyze verify "$RUNNER_TEMP/sovereign-fleet-recover.service" \
            "$RUNNER_TEMP/sovereign-fleet-backup.service" \
            "$RUNNER_TEMP/sovereign-fleet-backup.timer"
      - name: Rehearse encrypted PostgreSQL dump and clean restore
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/library/postgres@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015"
          docker pull "$image"
          .venv/bin/python -m scripts.phase5_postgres_rehearsal \
            --image "$image" --restic "$RUNNER_TEMP/restic" \
            --restic-sha256 "$(sha256sum "$RUNNER_TEMP/restic" | cut -d' ' -f1)"
      - name: Restore encrypted pgvector knowledge set and recheck permissions
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd"
          docker pull "$image"
          .venv/bin/python -m scripts.phase3_pgvector_recovery \
            --image "$image" --restic "$RUNNER_TEMP/restic" \
            --restic-sha256 "$(sha256sum "$RUNNER_TEMP/restic" | cut -d' ' -f1)"
      - name: Start restored synthetic Core state and recheck permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 fixtures/generate.py
          docker build -f infrastructure/containers/Core.Dockerfile -t sovereign-core:synthetic .
          .venv/bin/python -m scripts.phase5_core_state_restore \
            --image sovereign-core:synthetic --restic "$RUNNER_TEMP/restic" \
            --restic-sha256 "$(sha256sum "$RUNNER_TEMP/restic" | cut -d' ' -f1)"

  pgvector-knowledge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          python-version: "3.14"
      - name: Start disposable loopback pgvector database
        run: |
          set -euo pipefail
          image="docker.io/pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd"
          docker pull "$image"
          docker run -d --rm --name sovereign-pgvector-test \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:55439:5432 \
            --tmpfs /var/lib/postgresql/data "$image"
          for attempt in $(seq 1 40); do
            if docker exec sovereign-pgvector-test pg_isready -U postgres -q; then break; fi
            sleep 1
          done
          docker exec sovereign-pgvector-test createdb -U postgres sovereign_pgvector_test
          docker exec sovereign-pgvector-test psql -U postgres -d sovereign_pgvector_test \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Test live policy, revocation, ingestion and vector ranking
        env:
          SOVEREIGN_TEST_PG_DSN: postgresql://postgres@127.0.0.1:55439/sovereign_pgvector_test
        run: |
          uv sync --locked --extra phase3
          .venv/bin/python -m unittest tests.test_phase3_postgres_index -v

  openfga-policy-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify and install pinned OpenFGA
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/openfga/openfga/releases/download/v1.22.1/openfga_1.22.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/openfga.tar.gz"
          echo "80d2d4b582762c02dc86b1246f7f6f54d6854259727b36e5b5c43ba90792814a  $RUNNER_TEMP/openfga.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openfga"
          tar -xzf "$RUNNER_TEMP/openfga.tar.gz" -C "$RUNNER_TEMP/openfga" openfga
      - name: Compare synthetic role matrix and revocation
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/openfga/openfga"
          python3 -m scripts.phase5_openfga_probe --binary "$binary" \
            --sha256 "$(sha256sum "$binary" | cut -d' ' -f1)"
